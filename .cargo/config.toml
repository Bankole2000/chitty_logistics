# Defaults for cargo commands run in this repository.
[env]
# #[sqlx::test] creates a throwaway database per test on this server (docker-compose.yml).
# A DATABASE_URL already set in the environment wins.
DATABASE_URL = { value = "postgres://postgres@127.0.0.1:15481/chitty", force = false }
# Local cargo run and cargo test are development. Deployed binaries are not started through
# cargo, so they get the api's own default (production) unless the deployment says otherwise.
API_ENV = { value = "development", force = false }
