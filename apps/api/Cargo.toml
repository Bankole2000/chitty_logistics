[package]
name = "api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "request-id", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
